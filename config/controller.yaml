marta:
  # Publish all joint states -----------------------------------
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50

  # Position Controllers ---------------------------------------
  # Outros controladores permanecem inalterados...

  # Definição dos parâmetros via âncoras para os tornozelos
  ank_roll_pid_left: &ank_roll_pid_left
    p: 50.0
    i: 0.0
    d: 0.05

  ank_roll_pid_right: &ank_roll_pid_right
    p: 50.0
    i: 0.0
    d: 0.06

  ank_pitch_pid: &ank_pitch_pid
    p: 20.0
    i: 0.0001
    d: 0.07

  # Left Leg ---------------------------------------------------
  l_hip_yaw_position:
    type: effort_controllers/JointPositionController
    joint: l_hip_yaw_link
    pid: {p: 50.0, i: 0.0, d: 0.05}

  l_hip_roll_position:
    type: effort_controllers/JointPositionController
    joint: l_hip_roll_link
    pid: {p: 50.0, i: 0.0, d: 0.05}

  l_hip_pitch_position:
    type: effort_controllers/JointPositionController
    joint: l_hip_pitch_link
    pid: {p: 50.0, i: 0.0, d: 0.05}

  l_knee_position:
    type: effort_controllers/JointPositionController
    joint: l_knee_link
    pid: {p: 50.0, i: 0.0, d: 0.05}

  l_ank_roll_position:
    type: effort_controllers/JointPositionController
    joint: l_ank_roll_link
    pid: *ank_roll_pid_left
  
  l_ank_pitch_position:
    type: effort_controllers/JointPositionController
    joint: l_ank_pitch_link
    pid: *ank_pitch_pid
  
  # Right Leg ---------------------------------------------------
  r_hip_yaw_position:
    type: effort_controllers/JointPositionController
    joint: r_hip_yaw_link
    pid: {p: 50.0, i: 0.0, d: 0.05}

  r_hip_roll_position:
    type: effort_controllers/JointPositionController
    joint: r_hip_roll_link
    pid: {p: 50.0, i: 0.0, d: 0.05}

  r_hip_pitch_position:
    type: effort_controllers/JointPositionController
    joint: r_hip_pitch_link
    pid: {p: 50.0, i: 0.0, d: 0.05}

  r_knee_position:
    type: effort_controllers/JointPositionController
    joint: r_knee_link
    pid: {p: 50.0, i: 0.0, d: 0.05}

  r_ank_roll_position:
    type: effort_controllers/JointPositionController
    joint: r_ank_roll_link
    pid: *ank_roll_pid_right
  
  r_ank_pitch_position:
    type: effort_controllers/JointPositionController
    joint: r_ank_pitch_link
    pid: *ank_pitch_pid
  
  # Left Arm ---------------------------------------------------
  l_sho_pitch_position:
    type: effort_controllers/JointPositionController
    joint: l_sho_pitch_link
    pid: {p: 10.0, i: 0.0, d: 0.05}

  l_sho_roll_position:
    type: effort_controllers/JointPositionController
    joint: l_sho_roll_link
    pid: {p: 10.0, i: 0.0, d: 0.05}

  l_el_position:
    type: effort_controllers/JointPositionController
    joint: l_el_link
    pid: {p: 10.0, i: 0.0, d: 0.05}

  # Right Arm ---------------------------------------------------
  r_sho_pitch_position:
    type: effort_controllers/JointPositionController
    joint: r_sho_pitch_link
    pid: {p: 10.0, i: 0.0, d: 0.05}

  r_sho_roll_position:
    type: effort_controllers/JointPositionController
    joint: r_sho_roll_link
    pid: {p: 10.0, i: 0.0, d: 0.05}

  r_el_position:
    type: effort_controllers/JointPositionController
    joint: r_el_link
    pid: {p: 10.0, i: 0.0, d: 0.05}

  # Head ---------------------------------------------------
  head_pan_position:
    type: effort_controllers/JointPositionController
    joint: head_pan_link
    pid: {p: 5.0, i: 0.0, d: 0.05}

  head_tilt_position:
    type: effort_controllers/JointPositionController
    joint: head_tilt_link
    pid: {p: 5.0, i: 0.0, d: 0.05}
